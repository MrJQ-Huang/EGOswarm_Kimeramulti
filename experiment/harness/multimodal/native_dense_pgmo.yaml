# Native PGMO 7a67674b677468e6c28152596c9aae66cd24ee4b MESH API.
# Geometry-only gate: no semantic label stream is claimed by this configuration.
run_mode: MESH
enable_sparsify: false
add_initial_prior: true
log_output: true
embed_trajectory_delta_t: 5.0
num_interp_pts: 4
interp_horizon: 3600.0
trans_node_dist: 0.5
rot_node_dist: 1.0
rpgo:
  odom_trans_threshold: 0.05
  odom_rot_threshold: 0.01
  pcm_trans_threshold: -1.0
  pcm_rot_threshold: -1.0
  lm_diagonal_damping: true
  gnc_alpha: 0.0
  gnc_max_iterations: 100
  gnc_mu_step: 1.6
  gnc_cost_tolerance: 0.00001
  gnc_weight_tolerance: 0.0001
  gnc_fix_prev_inliers: false
covariance:
  odom: 0.01
  loop_close: 0.05
  prior: 0.0001
  mesh_mesh: 0.01
  pose_mesh: 0.01
